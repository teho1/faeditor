<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Roland SVD1 container layout</title>
  <desc id="desc">A fixed header points to data areas. Each data area has its own header followed by fixed-size packed entries.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 650; }
    .small { font-size: 14px; }
    .box { stroke: #27344d; stroke-width: 2; rx: 8; }
    .head { fill: #dce8ff; }
    .descriptor { fill: #e8f3ed; }
    .area { fill: #fff3d6; }
    .entry { fill: #f3e8ff; }
    .arrow { stroke: #52627f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52627f"/></marker></defs>
  <text x="40" y="42" class="title">Roland SVD1 — observed container structure</text>
  <rect x="40" y="70" width="880" height="70" class="box head"/>
  <text x="60" y="98" class="label">Fixed header (16 bytes)</text>
  <text x="60" y="124" class="small">followingHeaderLength:u16 · "SVD1" · 10 reserved zero bytes</text>
  <rect x="40" y="165" width="880" height="82" class="box descriptor"/>
  <text x="60" y="194" class="label">Data-area descriptors (16 bytes each)</text>
  <text x="60" y="220" class="small">name/model:8 · absoluteOffset:u32 · areaLength:u32</text>
  <path d="M480 247 L480 287" class="arrow"/>
  <rect x="40" y="288" width="880" height="92" class="box area"/>
  <text x="60" y="318" class="label">Data-area header (16 bytes)</text>
  <text x="60" y="344" class="small">entryCount:u32 · packedEntryLength:u32 · entryOffset:u32 · reserved:u32</text>
  <path d="M480 380 L480 420" class="arrow"/>
  <rect x="40" y="420" width="270" height="72" class="box entry"/>
  <rect x="345" y="420" width="270" height="72" class="box entry"/>
  <rect x="650" y="420" width="270" height="72" class="box entry"/>
  <text x="126" y="451" class="label">Packed entry 1</text>
  <text x="431" y="451" class="label">Packed entry 2</text>
  <text x="732" y="451" class="label">Packed entry N</text>
  <text x="82" y="477" class="small">continuous MSB-first fields</text>
  <text x="387" y="477" class="small">fixed byte length per area</text>
  <text x="706" y="477" class="small">not generally byte-aligned</text>
  <text x="40" y="525" class="small">SVD1/MI73 area layout shown. SVD0 payloads differ; field widths are product/model-specific.</text>
</svg>
